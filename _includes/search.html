<!-- Search Modal -->
<div id="search-modal" class="search-modal" style="display: none;">
  <div class="search-modal-content">
    <div class="search-header">
      <input type="text" id="search-input" placeholder="Search posts, papers, projects..." autocomplete="off">
      <button class="search-close" onclick="closeSearch()">&times;</button>
    </div>
    <div class="search-filters">
      <button class="search-filter-btn active" data-filter="all">All</button>
      <button class="search-filter-btn" data-filter="post">Posts</button>
      <button class="search-filter-btn" data-filter="paper">Papers</button>
      <button class="search-filter-btn" data-filter="project">Projects</button>
    </div>
    <div id="search-results" class="search-results"></div>
  </div>
</div>

<style>
  .search-modal {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 2000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 10vh;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }

  .search-modal-content {
    background: var(--surface);
    border: 1px solid var(--border-accent);
    border-radius: var(--radius-lg);
    width: 90%;
    max-width: 620px;
    max-height: 70vh;
    overflow: hidden;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
    display: flex;
    flex-direction: column;
  }

  .search-header {
    display: flex;
    gap: 0.5rem;
    padding: 1rem;
    border-bottom: 1px solid var(--border);
  }

  #search-input {
    flex: 1;
    padding: 0.7rem 1rem;
    font-size: 1rem;
    border: 1px solid var(--border-accent);
    border-radius: var(--radius);
    background: var(--surface-raised);
    color: var(--text);
    font-family: var(--font-sans);
  }

  #search-input::placeholder { color: var(--text-dim); }

  #search-input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .search-close {
    background: var(--surface-raised);
    border: 1px solid var(--border-accent);
    border-radius: var(--radius);
    font-size: 1.25rem;
    color: var(--text-muted);
    cursor: pointer;
    padding: 0 0.75rem;
    line-height: 1;
    transition: all 0.2s;
  }

  .search-close:hover {
    background: var(--border);
    color: var(--text);
  }

  .search-filters {
    display: flex;
    gap: 0.4rem;
    padding: 0.625rem 1rem;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .search-filter-btn {
    padding: 0.3rem 0.75rem;
    border: 1px solid var(--border-accent);
    border-radius: 100px;
    background: var(--surface-raised);
    color: var(--text-muted);
    font-size: 0.8rem;
    font-family: var(--font-sans);
    cursor: pointer;
    transition: all 0.2s;
  }

  .search-filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .search-filter-btn.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .search-results {
    flex: 1;
    overflow-y: auto;
    padding: 0.75rem;
  }

  .search-result-item {
    padding: 0.875rem 1rem;
    border-radius: var(--radius);
    margin-bottom: 0.375rem;
    background: var(--surface-raised);
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
  }

  .search-result-item:hover {
    background: var(--accent-glow);
    border-color: var(--accent);
  }

  .result-title {
    font-weight: 600;
    font-size: 0.975rem;
    color: var(--text);
    margin-bottom: 0.25rem;
    font-family: var(--font-display);
  }

  .result-excerpt {
    font-size: 0.84rem;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .result-date {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-family: var(--font-mono);
  }

  .no-results {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
    font-size: 0.9rem;
  }

  /* Type badges */
  .result-type-badge {
    display: inline-block;
    padding: 0.12rem 0.45rem;
    border-radius: 4px;
    font-size: 0.65rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-left: 0.5rem;
    vertical-align: middle;
  }

  .result-type-badge.post   { background: rgba(34,197,94,0.12); color: #4ade80; }
  .result-type-badge.paper  { background: var(--accent-glow); color: var(--accent); }
  .result-type-badge.project { background: rgba(251,191,36,0.12); color: #fbbf24; }

  .result-meta {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    flex-wrap: wrap;
    margin-top: 0.25rem;
  }

  .result-venue {
    font-size: 0.75rem;
    color: var(--text-dim);
    font-style: italic;
  }

  /* Highlight matches */
  .search-result-item mark {
    background: rgba(59,130,246,0.25);
    color: var(--accent-hover);
    border-radius: 2px;
    padding: 0 1px;
  }

  [data-theme="light"] .search-result-item mark {
    background: rgba(37,99,235,0.15);
    color: var(--accent);
  }

  /* Keyboard shortcut hint */
  .search-hint {
    text-align: center;
    padding: 0.5rem;
    font-size: 0.75rem;
    color: var(--text-dim);
    border-top: 1px solid var(--border);
  }

  .search-hint kbd {
    background: var(--surface-raised);
    border: 1px solid var(--border-accent);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
    font-family: var(--font-mono);
    font-size: 0.7rem;
  }
</style>

<script>
// Search data populated by Jekyll
const searchData = [
  // Blog Posts
  {% for post in site.posts %}
  {
    type: "post",
    title: {{ post.title | jsonify }},
    url: "{{ site.baseurl }}{{ post.url }}",
    date: "{{ post.date | date: '%Y-%m-%d' }}",
    excerpt: {{ post.excerpt | strip_html | truncatewords: 30 | jsonify }},
    content: {{ post.content | strip_html | truncatewords: 200 | jsonify }},
    tags: {{ post.tags | jsonify }},
    venue: null
  },
  {% endfor %}
  // Research Papers
  {% for paper in site.data.papers %}
  {
    type: "paper",
    title: {{ paper.title | jsonify }},
    url: {% if paper.page %}{{ paper.page | jsonify }}{% elsif paper.arxiv %}{{ paper.arxiv | jsonify }}{% elsif paper.pdf %}{{ paper.pdf | jsonify }}{% else %}null{% endif %},
    date: "{{ paper.year }}",
    excerpt: {{ paper.abstract | default: "" | jsonify }},
    content: {{ paper.abstract | default: "" | jsonify }},
    tags: {{ paper.tags | jsonify }},
    venue: {{ paper.venue_short | jsonify }},
    authors: {{ paper.authors | jsonify }}
  },
  {% endfor %}
  // Projects
  {% for project in site.data.projects %}
  {
    type: "project",
    title: {{ project.title | jsonify }},
    url: {{ project.github | jsonify }},
    date: null,
    excerpt: {{ project.description | default: "" | jsonify }},
    content: {{ project.description | default: "" | jsonify }},
    tags: {{ project.tags | jsonify }},
    venue: null,
    category: {{ project.category | jsonify }}
  }{% unless forloop.last %},{% endunless %}
  {% endfor %}
];

let activeFilter = 'all';

function openSearch() {
  document.getElementById('search-modal').style.display = 'flex';
  document.getElementById('search-input').focus();
  document.body.style.overflow = 'hidden';
}

function closeSearch() {
  document.getElementById('search-modal').style.display = 'none';
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').innerHTML = '';
  document.body.style.overflow = '';
}

function setFilter(filter) {
  activeFilter = filter;
  document.querySelectorAll('.search-filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.filter === filter);
  });
  performSearch(document.getElementById('search-input').value);
}

function performSearch(query) {
  const resultsContainer = document.getElementById('search-results');

  if (!query || query.length < 2) {
    resultsContainer.innerHTML = '<div class="no-results">Type at least 2 characters to search&hellip;</div>';
    return;
  }

  const queryLower = query.toLowerCase();
  let results = searchData.filter(item => {
    if (activeFilter !== 'all' && item.type !== activeFilter) return false;
    return (
      (item.title   && item.title.toLowerCase().includes(queryLower)) ||
      (item.excerpt && item.excerpt.toLowerCase().includes(queryLower)) ||
      (item.content && item.content.toLowerCase().includes(queryLower)) ||
      (item.tags    && item.tags.some(t => t.toLowerCase().includes(queryLower))) ||
      (item.venue   && item.venue.toLowerCase().includes(queryLower)) ||
      (item.authors && item.authors.some(a => a.toLowerCase().includes(queryLower)))
    );
  });

  if (results.length === 0) {
    const label = activeFilter === 'all' ? 'results' : activeFilter + 's';
    resultsContainer.innerHTML = `<div class="no-results">No ${label} found.</div>`;
    return;
  }

  resultsContainer.innerHTML = results.map(item => {
    const badge   = `<span class="result-type-badge ${item.type}">${item.type}</span>`;
    const venue   = item.venue ? `<span class="result-venue">${item.venue}</span>` : '';
    const date    = item.date  ? `<span class="result-date">${item.date}</span>` : '';
    const excerpt = (item.excerpt || '').slice(0, 120) + ((item.excerpt || '').length > 120 ? '…' : '');
    return `
      <div class="search-result-item" onclick="window.location.href='${item.url}'">
        <div class="result-title">${highlight(item.title, query)}${badge}</div>
        <div class="result-excerpt">${highlight(excerpt, query)}</div>
        <div class="result-meta">${date}${venue}</div>
      </div>`;
  }).join('');
}

function highlight(text, query) {
  if (!query || !text) return text || '';
  const re = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
  return text.replace(re, '<mark>$1</mark>');
}

document.addEventListener('DOMContentLoaded', function() {
  const input = document.getElementById('search-input');
  if (input) input.addEventListener('input', e => performSearch(e.target.value));

  document.querySelectorAll('.search-filter-btn').forEach(btn => {
    btn.addEventListener('click', () => setFilter(btn.dataset.filter));
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeSearch();
    if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  });

  const modal = document.getElementById('search-modal');
  if (modal) modal.addEventListener('click', e => { if (e.target === modal) closeSearch(); });
});
</script>
