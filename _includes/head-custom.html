/* ================================================
   Design System — Dark-first (ssad2026-inspired)
   ================================================ */
*,*::before,*::after { box-sizing: border-box; }

:root {
  /* Dark mode (default) */
  --bg:             #07090f;
  --surface:        #0d1320;
  --surface-raised: #121b2e;
  --border:         rgba(255,255,255,0.07);
  --border-accent:  rgba(255,255,255,0.13);
  --text:           #eef2ff;
  --text-muted:     #7d8fa3;
  --text-dim:       #4a5568;
  --accent:         #3b82f6;
  --accent-hover:   #60a5fa;
  --accent-glow:    rgba(59,130,246,0.14);
  --green:          #22c55e;
  --orange:         #f97316;
  --radius:         10px;
  --radius-lg:      18px;
  --font-sans:      'Inter', system-ui, -apple-system, sans-serif;
  --font-display:   'Space Grotesk', 'Inter', system-ui, sans-serif;
  --font-mono:      'JetBrains Mono', 'Consolas', 'Liberation Mono', monospace;
  /* Legacy aliases for backward compat with existing post styles */
  --color-bg:             var(--bg);
  --color-surface:        var(--surface);
  --color-primary:        var(--accent);
  --color-secondary:      var(--accent);
  --color-accent:         var(--accent);
  --color-text-primary:   var(--text);
  --color-text-secondary: var(--text-muted);
  --color-text-tertiary:  var(--text-dim);
  --color-border:         var(--border);
  --color-code-bg:        var(--surface);
  --color-code-text:      var(--text-muted);
  --color-link:           var(--accent);
  --color-link-hover:     var(--accent-hover);
  --color-success:        var(--green);
  --gradient-start:       #0f2054;
  --gradient-end:         #0e3a5c;
}

[data-theme="light"] {
  --bg:             #f5f7fc;
  --surface:        #ffffff;
  --surface-raised: #edf0f7;
  --border:         rgba(0,0,0,0.09);
  --border-accent:  rgba(0,0,0,0.16);
  --text:           #0f172a;
  --text-muted:     #475569;
  --text-dim:       #8492a6;
  --accent:         #2563eb;
  --accent-hover:   #1d4ed8;
  --accent-glow:    rgba(37,99,235,0.08);
  --gradient-start: #1e40af;
  --gradient-end:   #06b6d4;
}

/* ================================================
   Base
   ================================================ */
html { scroll-behavior: smooth; }

body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 16px;
  line-height: 1.65;
  margin: 0;
  padding-top: 56px;
  overflow-x: hidden;
  transition: background 0.25s, color 0.25s;
}

body.preload * { transition: none !important; }

a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--accent-hover); text-decoration: underline; }

/* ================================================
   Navigation
   ================================================ */
.main-nav-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  padding: 0 1.5rem;
  height: 56px;
  transition: background 0.3s, backdrop-filter 0.3s, border-bottom 0.3s;
}

.main-nav-bar.scrolled {
  background: rgba(7,9,15,0.90);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}

[data-theme="light"] .main-nav-bar.scrolled {
  background: rgba(245,247,252,0.93);
  border-bottom: 1px solid var(--border);
}

.nav-container {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 1200px;
  margin: 0 auto;
}

.nav-brand {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.95rem;
  color: var(--text) !important;
  text-decoration: none !important;
  letter-spacing: -0.01em;
}

.nav-brand:hover { opacity: 0.75; text-decoration: none !important; }

.nav-links {
  display: flex;
  align-items: center;
  gap: 0.125rem;
}

.nav-links a {
  color: var(--text-muted) !important;
  text-decoration: none !important;
  font-size: 0.875rem;
  font-weight: 500;
  padding: 0.4rem 0.8rem;
  border-radius: var(--radius);
  transition: color 0.2s, background 0.2s;
}

.nav-links a:hover {
  color: var(--text) !important;
  background: var(--border);
  text-decoration: none !important;
}

.nav-icon-btn {
  background: none;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius);
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  font-size: 0.85rem;
  color: var(--text-muted);
  line-height: 1;
  transition: background 0.2s, color 0.2s;
  display: flex;
  align-items: center;
}

.nav-icon-btn:hover {
  background: var(--border);
  color: var(--text);
}

.nav-toggle {
  display: none;
  background: none;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius);
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  color: var(--text);
  font-size: 1rem;
  line-height: 1;
  transition: background 0.2s;
}
.nav-toggle:hover { background: var(--border); }

@media (max-width: 768px) {
  .nav-toggle { display: block; }
  .nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--surface);
    flex-direction: column;
    align-items: stretch;
    padding: 0.75rem;
    gap: 0.25rem;
    border-bottom: 1px solid var(--border);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .nav-links.active { display: flex; }
  .nav-links a { padding: 0.75rem 1rem; }
  .nav-icon-btn { padding: 0.75rem; }
}

/* ================================================
   Main Content
   ================================================ */
.main-content {
  max-width: 820px;
  margin: 0 auto;
  padding: 3rem 2rem;
  word-wrap: break-word;
}

@media (max-width: 768px) { .main-content { padding: 2rem 1.25rem; } }

.main-content h1, .main-content h2, .main-content h3,
.main-content h4, .main-content h5, .main-content h6 {
  font-family: var(--font-display);
  color: var(--text) !important;
  margin-top: 2.25rem;
  margin-bottom: 0.875rem;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}

.main-content h1 { font-size: 2.125rem; }
.main-content h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
.main-content h3 { font-size: 1.2rem; }

.main-content p { color: var(--text-muted) !important; margin-bottom: 1.1em; }
.main-content li { color: var(--text-muted) !important; margin-bottom: 0.25em; }
.main-content strong { color: var(--text) !important; font-weight: 600; }
.main-content em { color: var(--text-muted) !important; }

/* Scope link color to non-button anchors to avoid overriding .cta-btn text */
.main-content a:not(.cta-btn) { color: var(--accent) !important; }
.main-content a:not(.cta-btn):hover { color: var(--accent-hover) !important; }

/* Code */
.main-content code {
  font-family: var(--font-mono) !important;
  font-size: 0.85em;
  padding: 0.15em 0.4em;
  background: var(--surface-raised) !important;
  color: var(--text) !important;
  border-radius: 5px;
  border: 1px solid var(--border);
}

.main-content pre {
  font-family: var(--font-mono) !important;
  font-size: 0.875rem;
  background: var(--surface) !important;
  border: 1px solid var(--border-accent) !important;
  border-radius: var(--radius);
  padding: 1.25rem;
  overflow: auto;
  position: relative;
  line-height: 1.6;
  -webkit-overflow-scrolling: touch;
}

.main-content pre > code {
  background: transparent !important;
  border: none !important;
  padding: 0 !important;
  font-size: inherit;
  color: var(--text) !important;
}

.main-content .highlight {
  background: var(--surface) !important;
  border: 1px solid var(--border-accent);
  border-radius: var(--radius);
  margin-bottom: 1.25rem;
  position: relative;
  overflow: hidden;
}

.main-content .highlight pre {
  background: transparent !important;
  border: none !important;
  margin: 0;
}

.main-content .highlight pre, .main-content pre {
  padding: 1.125rem;
  overflow: auto;
  font-size: 0.875rem;
  line-height: 1.6;
}

/* Blockquote */
.main-content blockquote {
  border-left: 2px solid var(--accent);
  margin-left: 0;
  padding: 0.5rem 1.25rem;
  color: var(--text-muted) !important;
  background: var(--accent-glow);
  border-radius: 0 var(--radius) var(--radius) 0;
}

.main-content blockquote > :first-child { margin-top: 0; }
.main-content blockquote > :last-child { margin-bottom: 0; }

/* Tables */
.main-content table { display: block; width: 100%; overflow: auto; border-collapse: collapse; }
.main-content th, .main-content td {
  padding: 0.6rem 0.875rem;
  border: 1px solid var(--border-accent);
  color: var(--text-muted) !important;
}
.main-content th {
  background: var(--surface);
  color: var(--text) !important;
  font-weight: 600;
  font-family: var(--font-display);
}

/* HR */
.main-content hr {
  border: none;
  border-top: 1px solid var(--border-accent);
  margin: 2.5rem 0;
}

/* Images */
.main-content img {
  max-width: 100% !important;
  width: auto !important;
  height: auto;
  border-radius: var(--radius);
}

/* ================================================
   Syntax Highlighting — Dark (default)
   ================================================ */
.highlight .c, .highlight .c1, .highlight .cm, .highlight .cd { color: #6e7681; font-style: italic; }
.highlight .k, .highlight .kd, .highlight .kn, .highlight .kp, .highlight .kr, .highlight .kv { color: #ff7b72; font-weight: 600; }
.highlight .kc, .highlight .kt { color: #79c0ff; }
.highlight .s, .highlight .s1, .highlight .s2, .highlight .sb, .highlight .sc, .highlight .sd, .highlight .sh { color: #a5d6ff; }
.highlight .sr { color: #7ee787; }
.highlight .si { color: #79c0ff; }
.highlight .n, .highlight .nb, .highlight .nc, .highlight .no { color: #c9d1d9; }
.highlight .nf, .highlight .nx { color: #d2a8ff; }
.highlight .nn { color: #ffa657; }
.highlight .na { color: #79c0ff; }
.highlight .nv, .highlight .vc, .highlight .vg, .highlight .vi { color: #ffa657; }
.highlight .m, .highlight .mi, .highlight .mf, .highlight .mh, .highlight .mo, .highlight .il, .highlight .mb, .highlight .mx { color: #79c0ff; }
.highlight .o, .highlight .ow { color: #ff7b72; }
.highlight .p { color: #c9d1d9; }
.highlight .ge { font-style: italic; }
.highlight .gs { font-weight: bold; }
.highlight .bp { color: #79c0ff; }
.highlight .err { color: #f85149; background-color: rgba(248,81,73,0.1); }
.highlight { background: transparent !important; }

/* Syntax Highlighting — Light */
[data-theme="light"] .highlight .c, [data-theme="light"] .highlight .c1, [data-theme="light"] .highlight .cm { color: #6a737d; }
[data-theme="light"] .highlight .k, [data-theme="light"] .highlight .kd, [data-theme="light"] .highlight .kn { color: #d73a49; }
[data-theme="light"] .highlight .kc, [data-theme="light"] .highlight .kt { color: #005cc5; }
[data-theme="light"] .highlight .s, [data-theme="light"] .highlight .s1, [data-theme="light"] .highlight .s2 { color: #032f62; }
[data-theme="light"] .highlight .sr { color: #032f62; }
[data-theme="light"] .highlight .nf, [data-theme="light"] .highlight .nx { color: #6f42c1; }
[data-theme="light"] .highlight .n, [data-theme="light"] .highlight .nb, [data-theme="light"] .highlight .nc { color: #24292e; }
[data-theme="light"] .highlight .m, [data-theme="light"] .highlight .mi, [data-theme="light"] .highlight .mf { color: #005cc5; }
[data-theme="light"] .highlight .o, [data-theme="light"] .highlight .ow { color: #d73a49; }
[data-theme="light"] .highlight .p { color: #24292e; }
[data-theme="light"] .highlight .na { color: #005cc5; }
[data-theme="light"] .highlight .nv, [data-theme="light"] .highlight .vi { color: #e36209; }
[data-theme="light"] .highlight .nn { color: #6f42c1; }
[data-theme="light"] .highlight .err { color: #cb2431; background-color: #ffeef0; }

/* Copy button */
.code-header {
  position: absolute;
  top: 0.5rem;
  right: 0.5rem;
  z-index: 10;
}

.copy-code-button {
  background: var(--surface-raised);
  border: 1px solid var(--border-accent);
  border-radius: 6px;
  padding: 0.28rem 0.6rem;
  font-size: 0.7rem;
  font-family: var(--font-mono);
  color: var(--text-dim);
  cursor: pointer;
  opacity: 0;
  transition: all 0.2s;
}

.main-content pre:hover .copy-code-button,
.main-content .highlight:hover .copy-code-button { opacity: 1; }

.copy-code-button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
.copy-code-button.copied { background: var(--green); color: #fff; border-color: var(--green); opacity: 1; }

/* ================================================
   Footer
   ================================================ */
.site-footer {
  margin-top: 6rem;
  padding: 3rem 2rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
}

.footer-content {
  max-width: 760px;
  margin: 0 auto;
  text-align: center;
}

.footer-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1.75rem;
}

.footer-links a {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  color: var(--text-muted) !important;
  text-decoration: none !important;
  font-size: 0.83rem;
  font-weight: 500;
  padding: 0.4rem 0.875rem;
  border-radius: var(--radius);
  border: 1px solid var(--border-accent);
  background: var(--surface-raised);
  transition: all 0.2s;
}

.footer-links a:hover {
  border-color: var(--accent);
  color: var(--accent) !important;
  background: var(--accent-glow);
  text-decoration: none !important;
}

.footer-icon { display: none; }

.footer-quote {
  color: var(--text-dim) !important;
  font-style: italic;
  font-size: 0.875rem;
  margin: 0 0 0.875rem;
}

.footer-credits {
  color: var(--text-dim) !important;
  font-size: 0.8rem;
  margin: 0;
}

.footer-credits a { color: var(--text-muted) !important; }

/* ================================================
   Homepage
   ================================================ */
.homepage { max-width: 1100px; margin: 0 auto; }

.section-eyebrow {
  display: block;
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.75rem;
}

.hero-section {
  padding: 4rem 0 3.5rem;
  text-align: left;
}

.hero-title {
  font-family: var(--font-display);
  font-size: clamp(2.5rem, 5.5vw, 4rem);
  font-weight: 700;
  margin: 0 0 1.25rem;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--text) !important;
}

.hero-subtitle {
  font-size: 1.05rem;
  color: var(--text-muted) !important;
  max-width: 600px;
  line-height: 1.8;
  margin: 0 0 2.25rem;
}

.hero-subtitle strong { color: var(--text) !important; font-weight: 600; }

.hero-cta { display: flex; gap: 0.75rem; flex-wrap: wrap; }

.cta-btn {
  display: inline-block;
  padding: 0.65rem 1.5rem;
  border-radius: var(--radius);
  font-weight: 600;
  font-size: 0.9rem;
  text-decoration: none !important;
  transition: all 0.2s;
  border: 1px solid transparent;
  cursor: pointer;
}

.primary-btn {
  background: var(--accent);
  color: #fff !important;
  border-color: var(--accent);
}

.primary-btn:hover {
  opacity: 0.88;
  transform: translateY(-1px);
  box-shadow: 0 4px 16px var(--accent-glow);
  color: #fff !important;
  text-decoration: none !important;
}

.secondary-btn {
  background: var(--surface);
  color: var(--text) !important;
  border-color: var(--border-accent);
}

.secondary-btn:hover {
  border-color: var(--accent);
  color: var(--accent) !important;
  background: var(--accent-glow);
  transform: translateY(-1px);
  text-decoration: none !important;
}

.home-featured-research, .home-recent-posts, .home-research-areas, .home-cta {
  margin-bottom: 5rem;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  margin-bottom: 1.75rem;
  flex-wrap: wrap;
  gap: 0.75rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.875rem;
}

.section-header h2 {
  font-family: var(--font-display);
  font-size: 1.375rem;
  font-weight: 700;
  margin: 0;
  color: var(--text) !important;
  letter-spacing: -0.02em;
  border-bottom: none !important;
  padding-bottom: 0 !important;
}

.view-all-link {
  color: var(--text-dim) !important;
  font-size: 0.82rem;
  font-weight: 500;
  text-decoration: none !important;
  transition: color 0.2s;
}

.view-all-link:hover { color: var(--accent) !important; text-decoration: none !important; }

.featured-grid { display: grid; gap: 1rem; }
.posts-list { display: flex; flex-direction: column; }

/* Post items */
.post-item {
  padding: 1.5rem 0;
  border-bottom: 1px solid var(--border);
}

.post-item:last-child { border-bottom: none; }

.post-meta {
  display: flex;
  gap: 1rem;
  margin-bottom: 0.4rem;
  flex-wrap: wrap;
  align-items: center;
}

.post-date, .post-reading-time {
  color: var(--text-dim) !important;
  font-size: 0.775rem;
  font-family: var(--font-mono);
}

.post-tags { display: flex; gap: 0.3rem; align-items: center; }

.tag, .tag-mini {
  display: inline-block;
  padding: 0.12rem 0.5rem;
  background: var(--surface-raised);
  color: var(--text-muted) !important;
  border: 1px solid var(--border-accent);
  border-radius: 5px;
  font-size: 0.7rem;
  font-weight: 500;
  letter-spacing: 0.01em;
}

[data-theme="light"] .tag, [data-theme="light"] .tag-mini {
  background: var(--surface-raised);
  border-color: var(--border-accent);
}

.post-title {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
  margin: 0.25rem 0 0.4rem;
  letter-spacing: -0.01em;
  line-height: 1.3;
}

.post-title a { color: var(--text) !important; text-decoration: none !important; }
.post-title a:hover { color: var(--accent) !important; text-decoration: none !important; }

.post-excerpt {
  color: var(--text-muted) !important;
  font-size: 0.875rem;
  margin: 0 0 0.625rem;
  line-height: 1.6;
}

.read-more {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-dim) !important;
  text-decoration: none !important;
  transition: color 0.2s;
}

.read-more:hover { color: var(--accent) !important; }

/* Research areas grid */
.research-areas-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  margin-top: 0.5rem;
}

.research-area-card {
  padding: 1.5rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  transition: all 0.2s;
}

.research-area-card:hover {
  border-color: var(--accent);
  transform: translateY(-2px);
  box-shadow: 0 4px 20px var(--accent-glow);
}

.area-icon {
  font-size: 1.25rem;
  margin-bottom: 0.75rem;
  color: var(--accent);
  font-family: var(--font-mono);
}

.research-area-card h3 {
  font-family: var(--font-display);
  font-size: 0.975rem;
  font-weight: 600;
  margin: 0 0 0.5rem;
  color: var(--text) !important;
  letter-spacing: -0.01em;
  border-bottom: none !important;
  padding-bottom: 0 !important;
  margin-top: 0 !important;
}

.research-area-card p {
  color: var(--text-muted) !important;
  font-size: 0.85rem;
  margin: 0;
  line-height: 1.6;
}

/* CTA section */
.home-cta {
  padding: 2.5rem;
  background: var(--surface);
  border: 1px solid var(--border-accent);

<script>
/* ================================================
   Theme System — Dark-first
   data-theme="light" on <html> = light mode
   No attribute (default) = dark mode
   ================================================ */
document.documentElement.classList.add('preload');

(function() {
  const saved = localStorage.getItem('theme');
  // Support both new key ('theme') and legacy key ('darkMode')
  const legacyLight = localStorage.getItem('darkMode') === 'false';
  if (saved === 'light' || (!saved && legacyLight)) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
  setTimeout(function() { document.documentElement.classList.remove('preload'); }, 80);
})();

function toggleDarkMode() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  if (isLight) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme', 'dark');
  } else {
    document.documentElement.setAttribute('data-theme', 'light');
    localStorage.setItem('theme', 'light');
  }
  updateToggleButton();
}

function updateToggleButton() {
  const isLight = document.documentElement.getAttribute('data-theme') === 'light';
  var icon = document.getElementById('theme-icon');
  if (icon) icon.textContent = isLight ? '◐' : '◑';
  var btn = document.getElementById('dark-mode-toggle');
  if (btn) btn.setAttribute('aria-label', isLight ? 'Switch to dark mode' : 'Switch to light mode');
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', updateToggleButton);
} else {
  updateToggleButton();
}

/* ================================================
   Nav scroll backdrop
   ================================================ */
function initNavScroll() {
  var nav = document.querySelector('.main-nav-bar');
  if (!nav) return;
  function onScroll() { nav.classList.toggle('scrolled', window.scrollY > 20); }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initNavScroll);
} else {
  initNavScroll();
}

/* ================================================
   Mobile nav
   ================================================ */
function toggleMobileNav() {
  var links = document.getElementById('nav-links');
  if (links) links.classList.toggle('active');
}

/* ================================================
   KaTeX
   ================================================ */
function initKaTeX() {
  if (typeof renderMathInElement !== 'undefined') {
    renderMathInElement(document.body, {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false,
      strict: false
    });
  }
}

/* ================================================
   BeerSlider
   ================================================ */
function initBeerSlider() {
  if (typeof BeerSlider === 'undefined') return;
  document.querySelectorAll('.beer-slider').forEach(function(el) {
    new BeerSlider(el);
  });
}

/* ================================================
   Code Copy Buttons
   ================================================ */
function addCopyButtonsToCodeBlocks() {
  var blocks = document.querySelectorAll('.main-content .highlight, .main-content pre');
  blocks.forEach(function(block) {
    if (block.querySelector('.copy-code-button')) return;
    if (block.tagName === 'PRE' && block.parentElement.classList.contains('highlight')) return;

    var header = document.createElement('div');
    header.className = 'code-header';
    var btn = document.createElement('button');
    btn.className = 'copy-code-button';
    btn.textContent = 'copy';

    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var code = (block.querySelector('code') || block).textContent;
      var self = this;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code).then(function() {
          self.textContent = 'copied!';
          self.classList.add('copied');
          setTimeout(function() { self.textContent = 'copy'; self.classList.remove('copied'); }, 2000);
        }).catch(function() {
          self.textContent = 'failed';
          setTimeout(function() { self.textContent = 'copy'; }, 2000);
        });
      } else {
        var ta = document.createElement('textarea');
        ta.value = code;
        ta.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        self.textContent = 'copied!';
        self.classList.add('copied');
        setTimeout(function() { self.textContent = 'copy'; self.classList.remove('copied'); }, 2000);
      }
    });

    if (window.getComputedStyle(block).position === 'static') block.style.position = 'relative';
    header.appendChild(btn);
    block.appendChild(header);
  });
}

/* ================================================
   BibTeX copy
   ================================================ */
function initBibtexButtons() {
  document.querySelectorAll('.bibtex-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.preventDefault();
      var bibtex = this.getAttribute('data-bibtex');
      var self = this;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(bibtex).then(function() {
          var orig = self.textContent;
          self.textContent = 'Copied!';
          setTimeout(function() { self.textContent = orig; }, 2000);
        });
      }
    });
  });
}

/* ================================================
   GitHub Stars (cached)
   ================================================ */
var STARS_KEY = 'gh_stars_v2';
var STARS_TTL = 86400000;

function starsCache() {
  try { return JSON.parse(localStorage.getItem(STARS_KEY) || '{}'); } catch(e) { return {}; }
}

async function fetchStars(repo) {
  var cache = starsCache();
  var hit = cache[repo];
  if (hit && (Date.now() - hit.t) < STARS_TTL) return hit.s;
  try {
    var r = await fetch('https://api.github.com/repos/' + repo);
    if (!r.ok) throw new Error();
    var d = await r.json();
    cache[repo] = { s: d.stargazers_count, t: Date.now() };
    try { localStorage.setItem(STARS_KEY, JSON.stringify(cache)); } catch(e) {}
    return d.stargazers_count;
  } catch(e) { return hit ? hit.s : null; }
}

async function initGitHubStars() {
  var cards = document.querySelectorAll('.project-card[data-github-repo]');
  for (var i = 0; i < cards.length; i++) {
    var card = cards[i];
    var repo = card.getAttribute('data-github-repo');
    var badge = card.querySelector('.project-stars-badge');
    var count = card.querySelector('.star-count');
    if (!repo || !badge || !count) continue;
    var n = await fetchStars(repo);
    if (n !== null) {
      count.textContent = n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(n);
    }
  }
}

/* ================================================
   Lazy loading
   ================================================ */
function initLazyLoading() {
  document.querySelectorAll('.post-content img, .main-content img').forEach(function(img) {
    if (!img.hasAttribute('loading')) img.setAttribute('loading', 'lazy');
  });
}

/* ================================================
   Init
   ================================================ */
function init() {
  addCopyButtonsToCodeBlocks();
  initBibtexButtons();
  initBeerSlider();
  initGitHubStars();
  initLazyLoading();
  if (typeof renderMathInElement !== 'undefined') initKaTeX();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
